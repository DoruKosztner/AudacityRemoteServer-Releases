    function detectSystemLang() {
      const langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
      for (const l of langs) {
        const code = String(l).toLowerCase().slice(0, 2);
        if (T[code]) return code;
      }
      return "en";
    }

    function setLang(code) {
      const t = T[code] || T.en;
      document.documentElement.lang = code;
      document.getElementById("langSel").value = T[code] ? code : "en";
      document.getElementById("lblLang").textContent = t.langLbl;
      document.getElementById("badgeVer").textContent = t.badge;
      document.getElementById("heroSub").textContent = t.heroSub;
      document.getElementById("btnDownload").textContent = t.dl;
      document.getElementById("btnReleases").textContent = t.rel;
      document.getElementById("capPc").textContent = t.capPc;
      document.getElementById("capMobile").textContent = t.capMobile;
      document.getElementById("f1Title").textContent = t.f1Title;
      document.getElementById("f1Body").textContent = t.f1Body;
      document.getElementById("f2Title").textContent = t.f2Title;
      document.getElementById("f2Body").textContent = t.f2Body;
      document.getElementById("f3Title").textContent = t.f3Title;
      document.getElementById("f3Body").textContent = t.f3Body;
      document.getElementById("guideTitle").textContent = t.guideTitle;
      document.getElementById("g1Title").textContent = t.g1Title;
      document.getElementById("g1List").innerHTML = t.g1.map(x => `<li>${x}</li>`).join("");
      document.getElementById("g2Title").textContent = t.g2Title;
      document.getElementById("g2List").innerHTML = t.g2.map(x => `<li>${x}</li>`).join("");
      document.getElementById("warnBox").innerHTML = t.warn;
      document.getElementById("storyTitle").textContent = t.storyTitle;
      document.getElementById("storyBody").textContent = t.storyBody;
      document.getElementById("privacyBody").textContent = t.privacy;
      document.getElementById("kofiLink").textContent = t.kofi;
      document.getElementById("footerTxt").textContent = t.footer;
    }
